<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Changer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04050d; --panel:rgba(10,14,34,.74); --line:rgba(120,210,255,.16); --line2:rgba(120,210,255,.32);
  --cyan:#38f6ff; --mag:#ff4fd8; --red:#ff3b5c; --text:#e6f3ff; --dim:#8aa0c0; --faint:#4a5a7a;
  --hud:'Orbitron',system-ui,sans-serif; --ui:'Chakra Petch',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;overflow-x:hidden;
  background:
    radial-gradient(1200px 600px at 85% -10%,rgba(255,79,216,.13),transparent 60%),
    radial-gradient(900px 700px at -10% 30%,rgba(56,246,255,.10),transparent 60%),
    radial-gradient(800px 500px at 60% 110%,rgba(120,80,255,.14),transparent 60%),var(--bg)}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.console{position:relative;z-index:1;max-width:1020px;margin:0 auto;padding:22px 16px 40px}
button,label.chip{font-family:var(--ui)}
button{cursor:pointer}

/* header */
header{display:flex;align-items:center;gap:14px;margin:4px 2px 18px}
.logo{width:46px;height:46px;flex:none;filter:drop-shadow(0 0 10px rgba(56,246,255,.6))}
h1{font-family:var(--hud);font-weight:900;font-size:clamp(22px,5.2vw,34px);letter-spacing:.14em;margin:0;line-height:1;
  background:linear-gradient(90deg,#fff 0%,var(--cyan) 45%,var(--mag) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 30px rgba(56,246,255,.25)}
.sub{font-family:var(--hud);font-size:10px;letter-spacing:.32em;color:var(--dim);margin-top:6px}
.sys{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--hud);font-size:10px;letter-spacing:.2em;color:var(--dim);white-space:nowrap}
.led{width:9px;height:9px;border-radius:50%;background:#3dff9a;box-shadow:0 0 10px #3dff9a}
.sys.busy .led{background:#ffd23f;box-shadow:0 0 10px #ffd23f;animation:blink .5s infinite alternate}
.sys.rec .led{background:var(--red);box-shadow:0 0 12px var(--red);animation:blink .4s infinite alternate}
@keyframes blink{to{opacity:.35}}

/* panels */
.panel{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04)}
.panel::before,.panel::after{content:"";position:absolute;width:18px;height:18px;border:2px solid var(--cyan);opacity:.55;pointer-events:none}
.panel::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:18px}
.panel::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:18px}
.label{font-family:var(--hud);font-size:11px;letter-spacing:.28em;color:var(--cyan);display:flex;align-items:center;gap:10px}
.label::before{content:"";width:6px;height:6px;background:var(--cyan);box-shadow:0 0 8px var(--cyan);transform:rotate(45deg)}
.label .hint{font-family:var(--ui);letter-spacing:.04em;font-size:13px;color:var(--dim);text-transform:none}

/* scope */
.scope-wrap{position:relative;margin:14px 0 16px;height:170px;border-radius:14px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(ellipse at center,rgba(56,246,255,.07),rgba(0,0,0,.35) 70%),#050915}
#scope{width:100%;height:100%;display:block}
.scope-msg{position:absolute;inset:auto 0 12px 0;text-align:center;font-family:var(--hud);font-size:11px;letter-spacing:.25em;color:var(--dim);pointer-events:none;transition:opacity .3s}
.scope-tag{position:absolute;top:10px;left:12px;font-family:var(--hud);font-size:9px;letter-spacing:.25em;color:var(--faint)}
.scope-tag b{color:var(--cyan);font-weight:500}

/* recorder row */
.rec-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.recbtn{position:relative;width:104px;height:104px;border-radius:50%;border:0;background:none;padding:0;flex:none}
.recbtn svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{stroke:rgba(255,59,92,.18)} .ring{stroke:var(--red);transition:stroke-dashoffset .1s linear;filter:drop-shadow(0 0 6px var(--red))}
.core{position:absolute;inset:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8098,var(--red) 55%,#9d0f2b);
  box-shadow:0 0 24px rgba(255,59,92,.55),inset 0 -6px 14px rgba(0,0,0,.35);display:grid;place-items:center;
  font-family:var(--hud);font-weight:700;font-size:13px;letter-spacing:.16em;color:#fff;transition:transform .15s,border-radius .2s}
.recbtn:active .core{transform:scale(.94)}
.recbtn.on .core{border-radius:18px;inset:28px;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 44px rgba(255,59,92,.95),inset 0 -6px 14px rgba(0,0,0,.35)}}
.timer{font-family:var(--hud);line-height:1}
.timer .num{font-size:40px;font-weight:700;color:#fff;text-shadow:0 0 18px rgba(56,246,255,.5);font-variant-numeric:tabular-nums}
.timer small{display:block;font-size:9px;letter-spacing:.3em;color:var(--dim);margin-top:6px}
.rec-actions{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:12px;border:1px solid var(--line2);background:rgba(56,246,255,.06);
  color:var(--text);font-size:14px;font-weight:600;letter-spacing:.03em;cursor:pointer;transition:background .2s,border-color .2s,box-shadow .2s;user-select:none}
.chip:hover{background:rgba(56,246,255,.12);border-color:var(--cyan)}
.chip:disabled{opacity:.35;cursor:default}
.chip svg{width:16px;height:16px}
.chip.pulse{animation:chipPulse 1.2s 3}
@keyframes chipPulse{50%{box-shadow:0 0 0 4px rgba(56,246,255,.35);border-color:var(--cyan)}}
.note{margin-top:14px;padding:12px 14px;border-radius:12px;border:1px dashed rgba(255,210,63,.45);background:rgba(255,210,63,.06);color:#ffe9a8;font-size:14px;line-height:1.45}

/* modules */
.mod-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.mod-head .spacer{flex:1}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:860px){.grid{grid-template-columns:repeat(2,1fr)}}
.card{--c:var(--cyan);position:relative;border-radius:16px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(255,255,255,.035),rgba(255,255,255,.01));
  padding:14px 14px 12px;cursor:pointer;transition:border-color .25s,box-shadow .25s,background .25s,transform .12s;user-select:none;outline:none;overflow:hidden}
.card:hover{border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.card:focus-visible{box-shadow:0 0 0 2px var(--c)}
.card:active{transform:scale(.985)}
.card.on{border-color:var(--c);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 16%,transparent),rgba(255,255,255,.015) 70%);
  box-shadow:0 0 22px color-mix(in srgb,var(--c) 28%,transparent),inset 0 0 30px color-mix(in srgb,var(--c) 8%,transparent)}
.card{display:flex;flex-direction:column}
.card .top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.icon{width:46px;height:46px;flex:none;border-radius:12px;display:grid;place-items:center;color:var(--c);
  background:color-mix(in srgb,var(--c) 10%,transparent);border:1px solid color-mix(in srgb,var(--c) 30%,transparent);transition:box-shadow .25s}
.card.on .icon{box-shadow:0 0 16px color-mix(in srgb,var(--c) 55%,transparent);color:#fff;background:color-mix(in srgb,var(--c) 35%,transparent)}
.icon svg{width:30px;height:30px}
.card .name{font-family:var(--hud);font-weight:700;font-size:13.5px;letter-spacing:.08em}
.card .tag{font-size:12.5px;color:var(--dim);margin-top:4px;line-height:1.3}
.sw{flex:none;width:38px;height:22px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid var(--line2);position:relative;transition:background .25s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#8aa0c0;transition:transform .25s,background .25s}
.card.on .sw{background:color-mix(in srgb,var(--c) 40%,transparent);border-color:var(--c)}
.card.on .sw::after{transform:translateX(16px);background:#fff;box-shadow:0 0 8px var(--c)}
.ctrls{margin-top:auto;opacity:.38;transition:opacity .25s;filter:saturate(.4)}
.card.on .ctrls{opacity:1;filter:none}
.ctl{margin-top:12px}
.ctl .row{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.14em;color:var(--dim);font-family:var(--hud);margin-bottom:6px}
.ctl .row b{color:var(--c);font-weight:500}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:4px;background:linear-gradient(90deg,var(--c) var(--p,50%),rgba(255,255,255,.1) var(--p,50%))}
input[type=range]::-moz-range-track{height:6px;border-radius:4px;background:linear-gradient(90deg,var(--c) var(--p,50%),rgba(255,255,255,.1) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;margin-top:-7px;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 60%,transparent),0 0 12px var(--c)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 60%,transparent),0 0 12px var(--c)}
.ends{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);margin-top:-2px}
.order{position:absolute;top:8px;right:56px;font-family:var(--hud);font-size:9px;color:var(--c);opacity:0;transition:opacity .2s}

/* output */
.out{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.big-play{flex:1 1 300px;min-height:68px;border-radius:16px;border:1px solid var(--cyan);color:#001318;font-family:var(--hud);font-weight:900;font-size:16px;letter-spacing:.16em;
  background:linear-gradient(90deg,var(--cyan),#7cf9ff 50%,var(--mag));box-shadow:0 0 30px rgba(56,246,255,.35);display:flex;align-items:center;justify-content:center;gap:12px;transition:transform .12s,box-shadow .2s,filter .2s}
.big-play:hover{box-shadow:0 0 44px rgba(56,246,255,.6)}
.big-play:active{transform:scale(.98)}
.big-play:disabled{filter:grayscale(.8) brightness(.6);cursor:default}
.big-play svg{width:22px;height:22px}
.out .chip{min-height:52px}
.stack{margin-top:14px;font-size:13px;color:var(--dim);min-height:20px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{padding:3px 10px;border-radius:20px;border:1px solid var(--pc);color:var(--pc);font-family:var(--hud);font-size:10px;letter-spacing:.12em;background:color-mix(in srgb,var(--pc) 12%,transparent)}
.prog{height:4px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:14px;opacity:0;transition:opacity .2s}
.prog.show{opacity:1}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--mag));box-shadow:0 0 10px var(--cyan);transition:width .25s}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--cyan);width:16px;height:16px}
footer{text-align:center;color:var(--faint);font-family:var(--hud);font-size:9px;letter-spacing:.3em;margin-top:24px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;background:rgba(10,14,34,.95);border:1px solid var(--cyan);color:var(--text);
  padding:12px 18px;border-radius:12px;font-size:14px;z-index:10;transition:all .3s;box-shadow:0 0 24px rgba(56,246,255,.3);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:520px){
  .console{padding:16px 10px 30px}
  .panel{padding:14px}
  .sys span{display:none}
  .scope-wrap{height:130px}
  .recbtn{width:92px;height:92px}
  .rec-actions{margin-left:0;width:100%}
  .rec-actions .chip{flex:1;justify-content:center}
  .grid{gap:10px}
  .card{padding:12px 11px 10px}
  .icon{width:40px;height:40px} .icon svg{width:26px;height:26px}
  .card .tag{font-size:11.5px}
  .mod-head .hint{display:none}
  .ctl{margin-top:8px}
  .sw{width:34px;height:20px} .sw::after{width:14px;height:14px} .card.on .sw::after{transform:translateX(14px)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<main class="console">
  <header>
    <svg class="logo" viewBox="0 0 48 48" fill="none" stroke-linecap="round">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38f6ff"/><stop offset="1" stop-color="#ff4fd8"/></linearGradient></defs>
      <circle cx="24" cy="24" r="13" stroke="url(#lg)" stroke-width="2.5"/>
      <ellipse cx="24" cy="24" rx="22" ry="7" stroke="url(#lg)" stroke-width="2" transform="rotate(-20 24 24)" opacity=".8"/>
      <path d="M16 24h2.5l2-5 3 10 3-8 2 3H32" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/>
    </svg>
    <div>
      <h1 id="appName">VOICE CHANGER</h1>
      <div class="sub">SPACE STATION AUDIO LAB</div>
    </div>
    <div class="sys" id="sys"><i class="led"></i><span id="sysText">SYSTEM READY</span></div>
  </header>

  <section class="panel">
    <div class="label">01 · RECORD <span class="hint">Up to 30 seconds</span></div>
    <div class="scope-wrap">
      <canvas id="scope"></canvas>
      <div class="scope-tag" id="scopeTag">SIGNAL · <b>STANDBY</b></div>
      <div class="scope-msg" id="scopeMsg">PRESS REC AND SAY SOMETHING</div>
    </div>
    <div class="rec-row">
      <button class="recbtn" id="recBtn" aria-label="Record">
        <svg viewBox="0 0 104 104"><circle class="ring-bg" cx="52" cy="52" r="48" fill="none" stroke-width="5"/>
          <circle class="ring" id="ring" cx="52" cy="52" r="48" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="301.6" stroke-dashoffset="0"/></svg>
        <div class="core" id="recCore">REC</div>
      </button>
      <div class="timer"><div class="num" id="timeNum">30.0</div><small id="timeLbl">SECONDS AVAILABLE</small></div>
      <div class="rec-actions">
        <button class="chip" id="playOrig" disabled>
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>Original</button>
        <label class="chip" id="fileLbl" for="fileIn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 16V4M6.5 9.5 12 4l5.5 5.5M4 20h16"/></svg>Use a clip</label>
        <input type="file" id="fileIn" accept="audio/*,video/*" hidden>
      </div>
    </div>
    <div class="note" id="micNote" hidden></div>
  </section>

  <section class="panel">
    <div class="mod-head">
      <div class="label">02 · VOICE MODULES <span class="hint">Tap to stack as many as you like</span></div>
      <span class="spacer"></span>
      <button class="chip" id="surprise">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg>Surprise me</button>
      <button class="chip" id="clearFx">Clear</button>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="panel">
    <div class="label">03 · TRANSMIT</div>
    <div class="out" style="margin-top:14px">
      <button class="big-play" id="playFx">
        <svg viewBox="0 0 24 24" fill="currentColor" id="playIcon"><path d="M7 4.5v15l13-7.5z"/></svg><span id="playTxt">PLAY MY NEW VOICE</span></button>
      <button class="chip" id="saveBtn" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 4v12M6.5 10.5 12 16l5.5-5.5M4 20h16"/></svg><span id="saveTxt">Save</span></button>
      <label class="toggle"><input type="checkbox" id="autoplay" checked> Auto-play changes</label>
    </div>
    <div class="prog" id="prog"><i id="progBar"></i></div>
    <div class="stack" id="stack"></div>
  </section>
  <footer>VOICE CHANGER · V0.1</footer>
</main>
<div class="toast" id="toast"></div>

<script id="engine">/* Voice Changer — audio engine.
   Pure-JS DSP so it runs the same in a Web Worker and in Node.
   Techniques: WSOLA time-stretch + windowed-sinc resampling (pitch),
   cepstral spectral-envelope warping (formants), zero-phase STFT robotization,
   cepstral cross-synthesis (voice formants imposed on a synthetic source),
   YIN pitch tracking, syllable detection, Freeverb, synthesized barks + sleigh bells. */
(function (root) {
  'use strict';
  const TAU = Math.PI * 2;
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ---------------- FFT ---------------- */
  const fftCache = {};
  function getFFT(n) { return fftCache[n] || (fftCache[n] = makeFFT(n)); }
  function makeFFT(n) {
    const levels = Math.round(Math.log2(n));
    const rev = new Uint32Array(n);
    for (let i = 0; i < n; i++) { let r = 0, x = i; for (let j = 0; j < levels; j++) { r = (r << 1) | (x & 1); x >>= 1; } rev[i] = r; }
    const cs = new Float64Array(n / 2), sn = new Float64Array(n / 2);
    for (let i = 0; i < n / 2; i++) { cs[i] = Math.cos(TAU * i / n); sn[i] = Math.sin(TAU * i / n); }
    function tr(re, im, inv) {
      for (let i = 0; i < n; i++) { const j = rev[i]; if (j > i) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; } }
      for (let size = 2; size <= n; size <<= 1) {
        const half = size >> 1, step = n / size;
        for (let i = 0; i < n; i += size) {
          for (let j = 0, k = 0; j < half; j++, k += step) {
            const a = i + j, b = a + half, c = cs[k], s = inv ? sn[k] : -sn[k];
            const tre = re[b] * c - im[b] * s, tim = re[b] * s + im[b] * c;
            re[b] = re[a] - tre; im[b] = im[a] - tim; re[a] += tre; im[a] += tim;
          }
        }
      }
      if (inv) { const q = 1 / n; for (let i = 0; i < n; i++) { re[i] *= q; im[i] *= q; } }
    }
    return { n, forward: (re, im) => tr(re, im, false), inverse: (re, im) => tr(re, im, true) };
  }

  function hann(N) { const w = new Float64Array(N); for (let i = 0; i < N; i++) w[i] = 0.5 - 0.5 * Math.cos(TAU * i / N); return w; }
  function sqrtHann(N) { const w = hann(N); for (let i = 0; i < N; i++) w[i] = Math.sqrt(w[i]); return w; }
  const fftSizeFor = sr => (sr > 32000 ? 2048 : 1024);

  /* Generic STFT: frames of every input are analysed; fn leaves the output spectrum in specs[0]. */
  function stftMulti(inputs, len, N, hop, fn) {
    const fft = getFFT(N), pad = N, total = len + 2 * pad, win = sqrtHann(N);
    const out = new Float64Array(total), norm = new Float64Array(total);
    const specs = inputs.map(() => ({ re: new Float64Array(N), im: new Float64Array(N) }));
    let fi = 0;
    for (let pos = 0; pos + N <= total; pos += hop, fi++) {
      for (let s = 0; s < inputs.length; s++) {
        const x = inputs[s], re = specs[s].re, im = specs[s].im, xl = x.length;
        for (let i = 0; i < N; i++) { const xi = pos + i - pad; re[i] = (xi >= 0 && xi < xl ? x[xi] : 0) * win[i]; im[i] = 0; }
        fft.forward(re, im);
      }
      fn(specs, fi);
      const re = specs[0].re, im = specs[0].im;
      fft.inverse(re, im);
      for (let i = 0; i < N; i++) { out[pos + i] += re[i] * win[i]; norm[pos + i] += win[i] * win[i]; }

/* ---------- modules: surprise / clear ---------- */
$('surprise').addEventListener('click', () => {
  ac();
  const ids = FX.map(f => f.id); let pick;
  do {
    pick = ids.filter(() => Math.random() < .3);
    if (pick.length < 2) pick = [ids[Math.random()*8|0], ids[Math.random()*8|0]];
    pick = [...new Set(pick)].slice(0, 3);
  } while ((pick.includes('giant') && pick.includes('mini')) || pick.length < 2);
  FX.forEach(f => { fx[f.id].on = pick.includes(f.id); if (fx[f.id].on) fx[f.id].s = .45 + Math.random()*.55; if (f.p2 && fx[f.id].on) fx[f.id].p2 = Math.random(); });
  if (fx.santa.on && fx.santa.p2 < .3) fx.santa.p2 = .5;
  syncAll(); toast('Surprise stack: ' + FX.filter(f => pick.includes(f.id)).map(f => f.name).join(' + '));
  persist(); renderStack(); if (clip) { clearTimeout(debounce); go(true); }
});
$('clearFx').addEventListener('click', () => { FX.forEach(f => fx[f.id].on = false); syncAll(); changed(); });

/* ---------- saving ---------- */
let downloads; const capPromise = (async () => {
  try { if (window.claude && typeof window.claude.use === 'function') downloads = await window.claude.use('downloads'); } catch(e){ downloads = null; }
  return downloads;
})();
function wavBlob(buf){
  const ch = buf.numberOfChannels, n = buf.length, sr = buf.sampleRate, b = new ArrayBuffer(44 + n*ch*2), v = new DataView(b);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o+i, s.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4, 36 + n*ch*2, true); w(8,'WAVEfmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,ch,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*ch*2,true); v.setUint16(32,ch*2,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,n*ch*2,true);
  const chans = []; for (let k = 0; k < ch; k++) chans.push(buf.getChannelData(k));
  let o = 44; for (let i = 0; i < n; i++) for (let k = 0; k < ch; k++) { const s = Math.max(-1, Math.min(1, chans[k][i])); v.setInt16(o, s < 0 ? s*32768 : s*32767, true); o += 2; }
  return new Blob([b], {type:'audio/wav'});
}
function encodeRealtime(buf, onP){
  return new Promise((resolve, reject) => {
    const types = ['audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/webm;codecs=opus','audio/webm'];
    const mt = window.MediaRecorder && types.find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
    if (!mt) return reject('norec');
    const c = ac(), dest = c.createMediaStreamDestination(), src = c.createBufferSource(); src.buffer = buf; src.connect(dest);
    const rec = new MediaRecorder(dest.stream, {mimeType: mt, audioBitsPerSecond: 160000}); const parts = [];
    rec.ondataavailable = e => e.data.size && parts.push(e.data);
    rec.onstop = () => { clearInterval(iv); resolve({blob: new Blob(parts, {type: mt.split(';')[0]}), ext: mt.includes('mp4') ? 'mp4' : 'webm'}); };
    rec.start(); const t0 = c.currentTime + .05; src.start(t0);
    const iv = setInterval(() => onP(Math.min(1, (c.currentTime - t0) / buf.duration)), 120);
    src.onended = () => setTimeout(() => rec.stop(), 150);
  });
}
function fileBase(){ const a = activeList().map(f => f.id); return 'voice-changer' + (a.length ? '-' + a.join('-') : ''); }
$('saveBtn').addEventListener('click', async () => {
  if (!lastFx) return;
  const btn = $('saveBtn'); btn.disabled = true;
  try {
    await Promise.race([capPromise, new Promise(r => setTimeout(r, 1500))]);
    const inFrame = window.top !== window.self;
    if (downloads) {
      $('saveTxt').textContent = 'Packing 0%';
      const {blob, ext} = await encodeRealtime(lastFx, p => $('saveTxt').textContent = 'Packing ' + Math.round(p*100) + '%');
      $('saveTxt').textContent = 'Save';
      await downloads.save({filename: fileBase() + '.' + ext, data: blob});
      toast('Saved! Send it to your friends.');
    } else if (!inFrame || !window.claude) {
      const blob = wavBlob(lastFx), name = fileBase() + '.wav', file = new File([blob], name, {type:'audio/wav'});
      if (navigator.canShare && /iPhone|iPad|Android/i.test(navigator.userAgent) && navigator.canShare({files:[file]})) {
        await navigator.share({files:[file], title:'Voice Changer'});
      } else {
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
        toast('Saved ' + name);
      }
    } else {
      toast('Saving isn\'t available in this view.');
    }
  } catch(e) {
    $('saveTxt').textContent = 'Save';
    const code = e && e.code;
    if (code === 'declined' || (e && e.name === 'AbortError')) toast('Save cancelled.');
    else if (code === 'rate_limited') toast('One moment — try that again.');
    else toast('Couldn\'t save this time.');
  } finally { btn.disabled = false; $('saveTxt').textContent = 'Save'; }
});

/* ---------- scope ---------- */
const scope = $('scope'), sg = scope.getContext('2d'); let shown = null, overview = null, ovFor = null;
function fitCanvas(cv){ const r = cv.getBoundingClientRect(), d = Math.min(2, window.devicePixelRatio || 1); const w = Math.round(r.width*d), h = Math.round(r.height*d); if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; } return d; }
function makeOverview(buf, cols){
  const n = buf.length, ch = [buf.getChannelData(0), buf.numberOfChannels > 1 ? buf.getChannelData(1) : null], out = new Float32Array(cols);
  const per = n / cols; let mx = 1e-6;
  for (let c = 0; c < cols; c++) { let p = 0; const a = Math.floor(c*per), b = Math.min(n, Math.floor((c+1)*per)); for (let i = a; i < b; i += 4) { const v = Math.abs(ch[0][i]) + (ch[1] ? Math.abs(ch[1][i]) : Math.abs(ch[0][i])); if (v > p) p = v; } out[c] = p; if (p > mx) mx = p; }
  for (let c = 0; c < cols; c++) out[c] = Math.pow(out[c]/mx, .7);
  return out;
}
const tbuf = new Float32Array(2048);
let phase = 0;
function drawScope(){
  const d = fitCanvas(scope), W = scope.width, H = scope.height, mid = H/2;
  sg.clearRect(0,0,W,H);
  sg.strokeStyle = 'rgba(56,246,255,.07)'; sg.lineWidth = 1;
  for (let x = 0; x < W; x += 28*d) { sg.beginPath(); sg.moveTo(x,0); sg.lineTo(x,H); sg.stroke(); }
  for (let y = mid % (28*d); y < H; y += 28*d) { sg.beginPath(); sg.moveTo(0,y); sg.lineTo(W,y); sg.stroke(); }
  sg.strokeStyle = 'rgba(56,246,255,.18)'; sg.beginPath(); sg.moveTo(0,mid); sg.lineTo(W,mid); sg.stroke();
  const line = (an, color, amp, width) => {
    an.getFloatTimeDomainData(tbuf);
    sg.save(); sg.strokeStyle = color; sg.lineWidth = width*d; sg.shadowColor = color; sg.shadowBlur = 14*d; sg.beginPath();
    for (let i = 0; i < 1024; i++) { const x = i/1023*W, y = mid - tbuf[i*2]*mid*amp; i ? sg.lineTo(x,y) : sg.moveTo(x,y); }
    sg.stroke(); sg.restore();
  };
  if (recording) { line(recording.an, '#ff5a78', 1.6, 2); }
  else if (shown) {
    const cols = Math.max(40, Math.floor(W / (5*d)));
    if (ovFor !== shown || !overview || overview.length !== cols) { overview = makeOverview(shown, cols); ovFor = shown; }
    const prog = playing && playing.buf === shown ? (ctx.currentTime - playing.t0) / shown.duration : -1;
    const bw = W/cols;
    for (let c = 0; c < cols; c++) {
      const h = Math.max(1.5*d, overview[c]*(H*.42)), past = prog >= 0 && c/cols < prog;
      sg.fillStyle = past ? (playing.kind === 'fx' ? 'rgba(255,79,216,.85)' : 'rgba(56,246,255,.85)') : 'rgba(120,180,255,.28)';
      sg.fillRect(c*bw + bw*.18, mid - h, bw*.64, h*2);
    }
    if (prog >= 0) {
      const x = prog*W; sg.save(); sg.strokeStyle = '#fff'; sg.shadowColor = '#fff'; sg.shadowBlur = 12*d; sg.lineWidth = 2*d; sg.beginPath(); sg.moveTo(x,0); sg.lineTo(x,H); sg.stroke(); sg.restore();
      line(analyser, playing.kind === 'fx' ? 'rgba(255,240,255,.9)' : 'rgba(220,255,255,.9)', 1.2, 1.6);
    }
  } else {
    phase += .03; sg.save(); sg.strokeStyle = 'rgba(56,246,255,.7)'; sg.shadowColor = '#38f6ff'; sg.shadowBlur = 12*d; sg.lineWidth = 2*d; sg.beginPath();
    for (let i = 0; i <= 200; i++) { const t = i/200, x = t*W, env = Math.sin(Math.PI*t), y = mid + Math.sin(t*22 + phase*3)*env*H*.12*(0.6 + .4*Math.sin(phase)) ; i ? sg.lineTo(x,y) : sg.moveTo(x,y); }
    sg.stroke(); sg.restore();
  }
  requestAnimationFrame(drawScope);
}
requestAnimationFrame(drawScope);

/* ---------- starfield ---------- */
(function(){
  const cv = $('stars'), g = cv.getContext('2d'); let stars = [];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function reset(){ const d = Math.min(2, devicePixelRatio || 1); cv.width = innerWidth*d; cv.height = innerHeight*d;
    stars = Array.from({length: Math.round(innerWidth*innerHeight/5000)}, () => ({x: Math.random()*cv.width, y: Math.random()*cv.height, z: Math.random()*.9 + .1, t: Math.random()*6.28})); }
  reset(); addEventListener('resize', reset);
  function step(){
    g.clearRect(0,0,cv.width,cv.height);
    for (const s of stars) {
      s.t += .02; if (!reduce) { s.y += s.z*.15; if (s.y > cv.height) { s.y = 0; s.x = Math.random()*cv.width; } }
      const a = (.35 + .65*s.z) * (.6 + .4*Math.sin(s.t));
      g.fillStyle = `rgba(${200+55*s.z|0},${220+35*s.z|0},255,${a})`; g.fillRect(s.x, s.y, s.z*2.2, s.z*2.2);
    }
    if (!reduce) requestAnimationFrame(step);
  }
  step();
})();
document.addEventListener('keydown', e => { if (e.code === 'Space' && !e.target.closest('input,button,.card')) { e.preventDefault(); go(false); } });
})();
</script>
